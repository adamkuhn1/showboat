<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Private phase: keep every surface out of search indexes until launch. -->
    <meta name="robots" content="noindex,nofollow" />
    <title>Showboat</title>
    <!-- No webfont is loaded: the app is off whole-application monospace
         (index.css), and the serif it uses now falls back to whatever
         Garamond-family or system serif is already on the device rather
         than fetching one — one less external request, and no font this
         sprint didn't already have a reason to add. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
