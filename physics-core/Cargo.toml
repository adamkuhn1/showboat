[package]
name = "showboat-physics-core"
version = "0.1.0"
edition = "2021"
description = "Event-based Han-2005-lineage 2D pool physics + MCTS rollout core for Showboat, compiled to WASM."
license = "UNLICENSED"
publish = false

[lib]
# cdylib for the wasm-pack/wasm-bindgen build; rlib so `cargo test` can link the
# crate natively without pulling in the wasm toolchain.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Small, fast, no-std-friendly PRNG for the MCTS rollout loop. Deterministic
# seeding keeps self-play / search reproducible.
[dependencies.getrandom]
version = "0.2"
features = ["js"]

[dependencies.js-sys]
version = "0.3"

[profile.release]
# Optimize the WASM for speed (this is a hot loop) then size.
opt-level = 3
lto = true
codegen-units = 1
